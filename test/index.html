<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>accsyn JS API Interactive test</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      font-family: sans-serif;
      padding: 16px;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 1.25rem; }
    form, #command { display: grid; gap: 8px; }
    label { display: grid; gap: 4px; }
    label.check { display: flex; align-items: center; gap: 8px; }
    input, textarea, button { font: inherit; }
    input, textarea { padding: 6px 8px; }
    button {
      justify-self: start;
      background: #55c3aa;
      color: white;
      border: none;
      min-width: 120px;
      min-height: 36px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #command { display: none; }
    #command textarea { resize: vertical; }
    #log {
      flex: 1;
      width: 100%;
      min-height: 160px;
      box-sizing: border-box;
      font-family: "Courier New", Courier, monospace;
    }
  </style>
</head>
<body>
  <h1>accsyn JS API Interactive test</h1>
  <form id="credentials">
    <label class="check"><input id="dev" name="dev" type="checkbox"> Dev</label>
    <label>Workspace <input id="workspace" name="workspace" autocomplete="off"></label>
    <label>User <input id="user" name="user" autocomplete="off"></label>
    <label>API key <input id="apiKey" name="apiKey" autocomplete="off"></label>
    <button id="connect" type="submit">CONNECT</button>
  </form>
  <div id="command">
    <label>Command
      <textarea id="expression" rows="3" placeholder='session.find("Job")'>session.find("Job")</textarea>
    </label>
    <button id="run" type="button">RUN</button>
  </div>
  <textarea id="log" readonly></textarea>
  <script type="module">
    import { Session } from "/dist/index.js";
    import { formatResult, runSessionCommand } from "/test/command.mjs";

    const devInput = document.getElementById("dev");
    const workspaceInput = document.getElementById("workspace");
    const userInput = document.getElementById("user");
    const apiKeyInput = document.getElementById("apiKey");
    const connectButton = document.getElementById("connect");
    const commandPanel = document.getElementById("command");
    const expressionInput = document.getElementById("expression");
    const runButton = document.getElementById("run");
    const log = document.getElementById("log");
    let session = null;

    function appendLog(message) {
      log.value += `[${new Date().toISOString()}] ${message}\n`;
      log.scrollTop = log.scrollHeight;
    }

    async function withConsole(fn) {
      const info = console.info.bind(console);
      const warn = console.warn.bind(console);
      console.info = (...args) => {
        appendLog(args.map(String).join(" "));
        info(...args);
      };
      console.warn = (...args) => {
        appendLog(args.map(String).join(" "));
        warn(...args);
      };
      try {
        return await fn();
      } finally {
        console.info = info;
        console.warn = warn;
      }
    }

    function setConnected(connected) {
      devInput.disabled = connected;
      workspaceInput.disabled = connected;
      userInput.disabled = connected;
      apiKeyInput.disabled = connected;
      connectButton.textContent = connected ? "DISCONNECT" : "CONNECT";
      commandPanel.style.display = connected ? "grid" : "none";
    }

    try {
      const response = await fetch("/env");
      if (response.ok) {
        const env = await response.json();
        if (env.ACCSYN_WORKSPACE) workspaceInput.value = env.ACCSYN_WORKSPACE;
        if (env.ACCSYN_API_USER) userInput.value = env.ACCSYN_API_USER;
        if (env.ACCSYN_API_KEY) apiKeyInput.value = env.ACCSYN_API_KEY;
        devInput.checked = env.AS_DEV === true;
        if (env.ACCSYN_WORKSPACE || env.ACCSYN_API_USER || env.ACCSYN_API_KEY) {
          appendLog("Loaded credentials from .env.");
        } else {
          appendLog("No ACCSYN_WORKSPACE, ACCSYN_API_USER, or ACCSYN_API_KEY in .env.");
        }
      }
    } catch {
      appendLog("Could not read .env. Start the page with npm run test:ui.");
    }

    document.getElementById("credentials").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (session) {
        session = null;
        setConnected(false);
        appendLog("Disconnected.");
        return;
      }
      const workspace = workspaceInput.value.trim();
      const username = userInput.value.trim();
      const apiKey = apiKeyInput.value.trim();
      if (!workspace || !username || !apiKey) {
        appendLog("Workspace, user, and API key are required.");
        return;
      }
      connectButton.disabled = true;
      appendLog(`Connecting as ${username}@${workspace}...`);
      try {
        session = await withConsole(() => Session.connect({
          workspace,
          username,
          apiKey,
          verbose: true,
          dev: devInput.checked,
          pathEnvfile: "/no/such/accsyn.env",
        }));
        setConnected(true);
        appendLog("Connected.");
      } catch (error) {
        session = null;
        appendLog(`Connect failed: ${error.message}`);
      } finally {
        connectButton.disabled = false;
      }
    });

    runButton.addEventListener("click", async () => {
      if (!session) {
        appendLog("Connect before running a command.");
        return;
      }
      const command = expressionInput.value.trim();
      appendLog(`> ${command}`);
      runButton.disabled = true;
      try {
        const result = await withConsole(() => runSessionCommand(session, command));
        appendLog(formatResult(result));
      } catch (error) {
        appendLog(`Run failed: ${error.message}`);
      } finally {
        runButton.disabled = false;
      }
    });
  </script>
</body>
</html>
